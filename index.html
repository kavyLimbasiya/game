<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <style>
        /* ============================================================
           FONT: Loads custom Barlow Condensed or user-added font
           ============================================================ */
        @font-face {
            font-family: 'HubFont';
            src: url('Assets/BarlowCondensed-Regular.ttf') format('truetype'),
                url('assets/BarlowCondensed-Regular.ttf') format('truetype'),
                url('Assets/font.woff2') format('woff2'),
                url('Assets/font.ttf') format('truetype'),
                url('Assets/font.otf') format('opentype');
            font-weight: 100 900;
            font-display: swap;
        }

        :root {
            --font-display: 'HubFont', 'Barlow Condensed', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-body: 'HubFont', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;

            --ink: #ffffff;
            --ink-dim: rgba(255, 255, 255, 0.78);
            --ink-faint: rgba(255, 255, 255, 0.52);
            --dark: rgba(12, 8, 7, 0.88);
            --glass: rgba(22, 14, 10, 0.46);
            --glass-edge: rgba(255, 255, 255, 0.22);
            --focus: #f5c518;
            --focus-glow: rgba(245, 197, 24, 0.35);
            --ready: #7ef0b4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            color-scheme: dark;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--ink);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            background-color: #0b0c10;
            background-image:
                url('Assets/BG.webp'), url('Assets/BG.png'),
                radial-gradient(55% 45% at 78% 8%, rgba(255, 168, 74, 0.25) 0%, transparent 62%),
                radial-gradient(50% 55% at 8% 85%, rgba(209, 46, 12, 0.3) 0%, transparent 65%),
                linear-gradient(160deg, #180d08 0%, #0c0807 55%, #050404 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Ambient subtle grain overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.12;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        }

        /* ---------- top bar ---------- */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 48px;
            background: rgba(18, 10, 7, 0.48);
            backdrop-filter: blur(30px) saturate(170%);
            -webkit-backdrop-filter: blur(30px) saturate(170%);
            border-bottom: 1px solid var(--glass-edge);
            box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.05);
        }

        .nav-left {
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .menu {
            display: flex;
            gap: 32px;
        }

        .menu-link {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink);
            background: none;
            border: 0;
            cursor: pointer;
            padding: 6px 0;
            position: relative;
        }

        .menu-link::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -3px;
            height: 2px;
            background: var(--focus);
            box-shadow: 0 0 10px var(--focus-glow);
            border-radius: 2px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .search {
            position: relative;
        }

        .search svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--ink-dim);
            pointer-events: none;
        }

        .search input {
            width: 260px;
            padding: 11px 18px 11px 42px;
            border-radius: 999px;
            outline: none;
            color: var(--ink);
            font: 600 14px var(--font-display);
            letter-spacing: 0.04em;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--glass-edge);
            backdrop-filter: blur(14px);
            transition: width .25s, border-color .2s, background .2s;
        }

        .search input::placeholder {
            color: var(--ink-faint);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .search input:focus {
            width: 320px;
            border-color: var(--focus);
            background: rgba(255, 255, 255, 0.18);
        }

        /* ---------- page layout ---------- */
        .wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1620px;
            margin: 0 auto;
            padding: 40px 48px 80px;
            flex: 1;
        }

        /* Section row header */
        .section-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin: 10px 2px 28px;
        }

        .section-row h2 {
            font: 700 36px var(--font-display);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .section-row span {
            font: 700 16px var(--font-display);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink-dim);
        }

        /* ---------- Enlarged Game Cards Grid (2x2 Cinematic Layout) ---------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 32px;
        }

        @media (max-width: 1020px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 26px;
            }
        }

        .tile {
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 28px;
            color: inherit;
            text-decoration: none;
            outline: none;
            background: linear-gradient(150deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04) 60%), var(--glass);
            backdrop-filter: blur(28px) saturate(170%);
            -webkit-backdrop-filter: blur(28px) saturate(170%);
            border: 1.5px solid var(--glass-edge);
            box-shadow: 0 24px 56px rgba(10, 4, 2, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        /* Bigger Card Header */
        .t-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 24px 28px 18px;
        }

        .t-name {
            font: 700 26px/1.2 var(--font-display);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .t-sub {
            margin-top: 4px;
            font: 600 15px var(--font-display);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--ink-dim);
        }

        .badge {
            flex-shrink: 0;
            font: 700 13px var(--font-display);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 999px;
            color: var(--ready);
            border: 1.5px solid rgba(126, 240, 180, 0.5);
            background: rgba(126, 240, 180, 0.14);
        }

        /* Bigger Thumbnail Frame */
        .t-media {
            position: relative;
            margin: 0 22px;
            aspect-ratio: 16 / 9;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(0, 0, 0, 0.4));
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .t-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            content-visibility: auto;
        }

        /* Bigger Blurb Description */
        .t-blurb {
            padding: 20px 28px 0;
            font: 400 16px/1.6 var(--font-body);
            color: var(--ink-dim);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: calc(16px * 1.6 * 2 + 20px);
        }

        /* Bigger Card Footer */
        .t-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 28px 26px;
            margin-top: auto;
            flex-wrap: wrap;
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }

        .tag {
            font: 700 12px var(--font-display);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--ink);
            white-space: nowrap;
        }

        /* Bigger CTA Launch Button */
        .cta {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 13px 28px;
            border-radius: 999px;
            font: 700 15px var(--font-display);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: #ffffff;
            color: #110804;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }

        .cta svg {
            width: 14px;
            height: 14px;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 0;
            font: 600 18px var(--font-display);
            letter-spacing: 0.05em;
            color: var(--ink-dim);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 40px;
            z-index: 100;
            transform: translate(-50%, 24px);
            padding: 14px 26px;
            border-radius: 999px;
            font: 600 14px var(--font-display);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            background: rgba(18, 9, 6, 0.88);
            border: 1px solid var(--focus);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            transition: all .3s cubic-bezier(.16, 1, .3, 1);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 860px) {
            .top-nav {
                flex-wrap: wrap;
                padding: 14px 20px;
            }

            .nav-left {
                flex-wrap: wrap;
                gap: 14px 24px;
            }

            .search input,
            .search input:focus {
                width: 100%;
            }

            .search {
                flex: 1;
            }

            .wrap {
                padding: 24px 20px 60px;
            }
        }
    </style>
</head>

<body>

    <header class="top-nav">
        <div class="nav-left">
            <nav class="menu">
                <button class="menu-link active" data-tab="play">PLAY</button>
            </nav>
        </div>
        <div class="nav-right">
            <div class="search">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input id="search" type="text" placeholder="Search title, genre or tag" autocomplete="off">
            </div>
        </div>
    </header>

    <main class="wrap">
        <div class="section-row">
            <h2 id="headline">All games</h2>
            <span id="counter">6 games</span>
        </div>

        <div class="grid" id="grid"></div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        /* ============================================================
           6 FOLDER GAMES WITH CUSTOM TAGS
           ============================================================ */
        const GAMES = [
            {
                title: 'Crown City',
                sub: 'Open-world 3D action',
                cat: 'action 3d open-world driving shooter',
                href: './Crown City/index.html',
                thumb: 'Game Thumbnail/crown.webp',
                fallback: 'Game Thumbnail/Crown City.png',
                blurb: 'The Big Score. Explore the city, take on missions, evade police, and build your fortune.',
                tags: ['Action', '3D', 'Open World', '1 Player game']
            },
            {
                title: 'APEX Coast Run',
                sub: '3D highway racer',
                cat: 'driving racing 3d',
                href: './APEX Coast Run/index.html',
                thumb: 'Game Thumbnail/apex.webp',
                fallback: 'Game Thumbnail/apex.png',
                blurb: 'Race a 3D highway along the coast and chase your best run.',
                tags: ['Racing', '3D', 'Driving', '1 Player game']
            },
            {
                title: 'Ultimate Bonk Arena',
                sub: 'Up to 2 players',
                cat: 'action 3d arcade multiplayer',
                href: './Ultimate Bonk arena/index.html',
                thumb: 'Game Thumbnail/bonk.webp',
                fallback: 'Game Thumbnail/bonk.png',
                blurb: 'Action battles in a single arena. Bring a friend.',
                tags: ['Action', '3D', 'Arcade', '1 Player game']
            },
            {
                title: 'Dust Yard',
                sub: '3D tactical shooter',
                cat: 'shooter 3d tactical action fps',
                href: './Dust Yard/index.html',
                thumb: 'Game Thumbnail/dust.webp',
                fallback: 'Game Thumbnail/dust.png',
                blurb: 'Tactical 3 vs 3 bomb defusal. Earn cash, buy weapons each round, and outplay the bots.',
                tags: ['Shooter', '3D', 'Tactical', '1 Player game']
            },
            {
                title: '10 Player Ludo 3D',
                sub: 'Up to 10 players',
                cat: 'fun 3d board multiplayer',
                href: './10 player Ludo/index.html',
                thumb: 'Game Thumbnail/ludo.webp',
                fallback: 'Game Thumbnail/ludo.png',
                blurb: 'Classic Ludo in 3D with room for up to ten players.',
                tags: ['Fun', '3D', 'Board', '10 Player game']
            },
            {
                title: 'Guru Runner',
                sub: 'Endless platformer',
                cat: 'runner 2d endless arcade',
                href: './BABA runner/index.html',
                thumb: 'Game Thumbnail/baba.webp',
                fallback: 'Game Thumbnail/baba.png',
                blurb: 'Keep running, keep jumping, and push your high score.',
                tags: ['Runner', '2D', 'Endless runner', '1 Player game']
            }
        ];

        const $ = id => document.getElementById(id);
        const grid = $('grid'), toast = $('toast');

        function render() {
            grid.innerHTML = GAMES.map((g, i) => {
                const isPriority = i < 2;
                return `
        <a class="tile" data-i="${i}" data-title="${g.title.toLowerCase()}" data-cat="${g.cat}" data-tags="${g.tags.join(' ').toLowerCase()}" href="${encodeURI(g.href)}">
            <div class="t-head">
                <div>
                    <div class="t-name">${g.title}</div>
                    <div class="t-sub">${g.sub}</div>
                </div>
                <span class="badge">READY</span>
            </div>
            <div class="t-media">
                <img src="${encodeURI(g.thumb)}" 
                     alt="${g.title}" 
                     width="1280" height="720"
                     decoding="async"
                     loading="${isPriority ? 'eager' : 'lazy'}"
                     ${isPriority ? 'fetchpriority="high"' : ''}
                     onerror="if(this.dataset.triedFallback){this.onerror=null;this.src='Assets/'+this.alt.toLowerCase().split(' ')[0]+'.png';}else{this.dataset.triedFallback='1';this.src='${encodeURI(g.fallback)}';}">
            </div>
            <p class="t-blurb">${g.blurb}</p>
            <div class="t-foot">
                <div class="tags">${g.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
                <span class="cta">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 21 12 6 21"/></svg>
                    Play
                </span>
            </div>
        </a>`;
            }).join('') + '<div class="empty" id="empty" hidden>No games match your search.</div>';
        }

        let timer;
        function showToast(msg) {
            toast.textContent = msg; toast.classList.add('show');
            clearTimeout(timer); timer = setTimeout(() => toast.classList.remove('show'), 2600);
        }

        function apply() {
            const q = $('search').value.toLowerCase().trim();
            let n = 0;
            grid.querySelectorAll('.tile').forEach(t => {
                const okQ = !q || t.dataset.title.includes(q) || t.dataset.cat.includes(q) || (t.dataset.tags && t.dataset.tags.includes(q));
                t.style.display = okQ ? '' : 'none';
                if (okQ) n++;
            });
            $('empty').hidden = n > 0;
            $('counter').textContent = `${n} ${n === 1 ? 'game' : 'games'}`;
        }

        $('search').addEventListener('input', apply);

        render();
        apply();
    </script>
</body>

</html>
